<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 52px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .txtrow { display:flex; gap:18px; margin-top:14px; align-items:baseline; }
  .txtrow span { font-size: 14px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F0A500; color:#1a1200">warn</div><div class="meta"><div class="name">warn</div><div class="hex">#F0A500</div></div></div>
    <div class="sw"><div class="chip" style="background:#4C9AFF; color:#001226">info</div><div class="meta"><div class="name">info</div><div class="hex">#4C9AFF</div></div></div>
  </div>
  <div class="txtrow">
    <span style="color:#FFFFFF; font-weight:600">text #FFFFFF</span>
    <span style="color:#9A9AA4">text-muted #9A9AA4</span>
    <span style="color:#6B6B74">text-faint #6B6B74</span>
  </div>
</body>
</html>
