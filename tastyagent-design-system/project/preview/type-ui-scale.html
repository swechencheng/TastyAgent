<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 22px; color: var(--text); }
  .stack > div { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .stack > div:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 120px; flex: none; }
</style>
</head>
<body>
  <div class="stack">
    <div><span class="tag">title / 22 · 600</span><span style="font-size:22px; font-weight:600; letter-spacing:-0.01em">Overview</span></div>
    <div><span class="tag">section / 15 · caps</span><span style="font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted)">Open positions</span></div>
    <div><span class="tag">body / 14 · 400</span><span style="font-size:14px">Sells premium when IV rank is elevated.</span></div>
    <div><span class="tag">label / 12 · caps</span><span style="font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted)">Total P/L</span></div>
  </div>
</body>
</html>
