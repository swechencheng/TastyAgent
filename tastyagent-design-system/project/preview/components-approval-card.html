<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 22px; color: var(--text); }
  .card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 12px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .sym { font-size: 16px; font-weight: 600; }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .pop { font-family: var(--font-mono); font-size: 12px; color: var(--gain); background: var(--gain-soft); padding: 3px 9px; border-radius: 999px; }
  .why { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin: 12px 0 14px; }
  .actions { display: flex; gap: 10px; }
  button { font-family: var(--font-ui); font-size: 13px; font-weight: 600; border-radius: 8px; padding: 8px 18px; cursor: pointer; border: 1px solid transparent; }
  .approve { background: var(--gain); color: #04130c; }
  .reject { background: transparent; color: var(--loss); border-color: var(--loss); }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div class="sym">NVDA · Short strangle</div>
        <div class="meta">2 contracts · credit $312 · 45 DTE</div>
      </div>
      <span class="pop">PoP 68%</span>
    </div>
    <div class="why">IV rank 82 — elevated. 16Δ short strikes, liquid chain, no earnings in window. Sized to 4% BP.</div>
    <div class="actions">
      <button class="approve">Approve</button>
      <button class="reject">Reject</button>
    </div>
  </div>
</body>
</html>
