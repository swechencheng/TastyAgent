<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 22px; }
  .row { display: flex; gap: 16px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
  .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; color: var(--text); margin-top: 8px; }
  .delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .up { background: var(--gain-soft); color: var(--gain); }
  .down { background: var(--loss-soft); color: var(--loss); }
</style>
</head>
<body>
  <div class="row">
    <div class="stat">
      <div class="lbl">Total P/L</div>
      <div class="val ds-gain">+$420.18</div>
      <span class="delta up">▲ 4.20%</span>
    </div>
    <div class="stat">
      <div class="lbl">Win rate</div>
      <div class="val">68%</div>
      <span class="delta up">17W / 8L</span>
    </div>
    <div class="stat">
      <div class="lbl">Unrealized</div>
      <div class="val ds-loss">−$112.40</div>
      <span class="delta down">▼ 1.1%</span>
    </div>
  </div>
</body>
</html>
