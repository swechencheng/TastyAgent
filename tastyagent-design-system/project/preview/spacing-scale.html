<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 22px; }
  .scale { display: flex; flex-direction: column; gap: 8px; }
  .unit { display: flex; align-items: center; gap: 12px; }
  .bar { height: 14px; background: var(--brand); border-radius: 3px; }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 96px; }
</style>
</head>
<body>
  <div class="scale">
    <div class="unit"><span class="lab">sp-1 · 4</span><div class="bar" style="width:4px"></div></div>
    <div class="unit"><span class="lab">sp-2 · 8</span><div class="bar" style="width:8px"></div></div>
    <div class="unit"><span class="lab">sp-3 · 12</span><div class="bar" style="width:12px"></div></div>
    <div class="unit"><span class="lab">sp-4 · 16</span><div class="bar" style="width:16px"></div></div>
    <div class="unit"><span class="lab">sp-5 · 20</span><div class="bar" style="width:20px"></div></div>
    <div class="unit"><span class="lab">sp-6 · 24</span><div class="bar" style="width:24px"></div></div>
    <div class="unit"><span class="lab">sp-8 · 32</span><div class="bar" style="width:32px"></div></div>
    <div class="unit"><span class="lab">sp-10 · 40</span><div class="bar" style="width:40px"></div></div>
  </div>
</body>
</html>
