<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-ui); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--text); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000000"></div><div class="meta"><div class="name">bg-pure</div><div class="hex">#000000</div></div></div>
    <div class="sw"><div class="chip" style="background:#0A0A0B"></div><div class="meta"><div class="name">bg / canvas</div><div class="hex">#0A0A0B</div></div></div>
    <div class="sw"><div class="chip" style="background:#141417"></div><div class="meta"><div class="name">surface</div><div class="hex">#141417</div></div></div>
    <div class="sw"><div class="chip" style="background:#1C1C21"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#1C1C21</div></div></div>
    <div class="sw"><div class="chip" style="background:#2A2A30"></div><div class="meta"><div class="name">border</div><div class="hex">#2A2A30</div></div></div>
  </div>
</body>
</html>
