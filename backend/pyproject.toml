[project]
name = "tastyagent"
version = "0.1.0"
description = "AI options-trading agent grounded in TastyTrade mechanics"
requires-python = ">=3.11"
dependencies = [
    "tastytrade>=9.0",      # tastyware SDK: orders, sandbox, backtesting
    "anthropic>=0.40",      # Claude LLM adaptive layer
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",          # also fetches the S&P 500 benchmark series (Yahoo, keyless)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tastyagent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
